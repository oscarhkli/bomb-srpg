name: CI & Coverage

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  unit_tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.26.9"
          cache: false

      - name: Run Tests with Coverage
        run: go test -race -cover -coverprofile=coverage.txt ./cli/... ./cmd/srpg-web/... ./cpu/... ./engine/... ./server/...

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage.txt

  web_tests:
    name: "Run Web Tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests with coverage
        run: npm run test:run -- --coverage
        working-directory: web

      - name: Archive web coverage results
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage/

  web_lint:
    name: "Lint, Typecheck & Build Web"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Check formatting
        run: npm run format:check
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  web_coverage:
    name: "Generate Web Coverage Report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: web_tests
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: web-coverage
          path: web/coverage

      - name: Run Vitest Coverage Report Action
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: web/coverage/coverage-summary.json
          json-final-path: web/coverage/coverage-final.json
          vite-config-path: web/vitest.config.ts
          name: "Web (Vitest)"

  code_coverage:
    name: "Generate Coverage Report"
    if: github.event_name == 'pull_request' # Only comment on Pull Requests
    runs-on: ubuntu-24.04
    needs: unit_tests
    permissions:
      contents: read
      actions: read # Required to download the baseline report from previous runs
      pull-requests: write # Required to post comments on your PRs
    # This env block silences the Node.js 20 warning completely
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Go Coverage Report Action
        uses: fgrosse/go-coverage-report@v1.3.0
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.txt"
          root-package: "bomb-srpg"
          exclude: "models\\.go"

  e2e_tests:
    name: "Run Web E2E Tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.26.9"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run e2e tests
        run: make web-e2e

      - name: Archive Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/e2e/playwright-report/
          retention-days: 7
